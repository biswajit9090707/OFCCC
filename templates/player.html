{% extends "base.html" %}
{% block title %}Stream · {{ title }} · {{ site_name }}{% endblock %}
{% block content %}
<style>
  .player-container {
    width: 100%;
    max-width: 900px;
    margin: 40px auto;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,.5);
    border: 1px solid var(--line);
    aspect-ratio: 16 / 9;
  }
  video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
  }
  .player-header {
    max-width: 900px;
    margin: 0 auto 16px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }
  .player-title {
    font-size: 20px;
    font-weight: 700;
    margin: 0;
  }
</style>

<div class="player-header">
  <h1 class="player-title">{{ title }}</h1>
  <a class="dl-back" href="javascript:history.back()" style="margin:0;">← Back</a>
</div>

<div class="player-container">
  <video controls playsinline preload="metadata" crossorigin="anonymous" controlsList="nodownload" oncontextmenu="return false;">
    <source src="{{ stream_url }}" type="video/mp4">
    Your browser does not support HTML5 video.
  </video>
</div>
{% endblock %}
