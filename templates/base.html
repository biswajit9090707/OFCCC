<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}{{ site_name }}{% endblock %}</title>
<meta name="description" content="{{ tagline }}">
<meta name="theme-color" content="#0b0b0f">
<link rel="preconnect" href="https://image.tmdb.org">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{ url_for('home') }}">
    <span class="brand-mark">></span>
    <span class="brand-name">{{ site_name }}</span>
  </a>
  <form class="search" action="{{ url_for('search') }}" method="get" role="search">
    <input type="search" name="q" placeholder="Search movies, series, anime..."
           value="{{ request.args.get('q','') }}" autocomplete="off" required>
    <button type="submit" aria-label="Search">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2">
        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
      </svg>
    </button>
  </form>
  <a class="tg-btn" href="{{ tg_channel_url }}" target="_blank" rel="noopener" aria-label="Join us on Telegram">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
      <path d="M12 0a12 12 0 1 0 0 24 12 12 0 0 0 0-24Zm5.56 8.18-1.85 8.74c-.14.62-.5.78-1.02.49l-2.81-2.07-1.36 1.31c-.15.15-.28.28-.56.28l.2-2.86 5.2-4.7c.23-.2-.05-.31-.35-.11l-6.43 4.05-2.77-.87c-.6-.19-.62-.6.13-.89l10.83-4.18c.5-.18.94.12.78.81Z"/>
    </svg>
    <span class="tg-label">{{ tg_channel }}</span>
  </a>
</header>

<main class="container">
  {% block content %}{% endblock %}
</main>

<footer class="footer">
  <div>&copy; {{ current_year }} {{ site_name }} - {{ tagline }}</div>
</footer>

<script>
(() => {
  const forms = document.querySelectorAll('form[role="search"], .hero-search');
  let activeBox = null;

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, ch => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;',
    }[ch]));
  }

  function closeBox(box) {
    box.hidden = true;
    box.innerHTML = '';
    box.dataset.index = '-1';
    if (activeBox === box) activeBox = null;
  }

  function renderBox(box, results, query) {
    if (!results.length) {
      box.innerHTML = `
        <div class="live-search-empty">
          No quick matches for "<strong>${escapeHtml(query)}</strong>"
        </div>`;
      box.hidden = false;
      box.dataset.index = '-1';
      activeBox = box;
      return;
    }

    box.innerHTML = results.map((item, index) => `
      <a class="live-search-item" href="${item.href}" data-index="${index}">
        <div class="live-search-poster">
          ${item.poster
            ? `<img src="${item.poster}" alt="${escapeHtml(item.title)}" loading="lazy">`
            : `<div class="live-search-poster-fallback">${escapeHtml((item.title || '?').slice(0, 1).toUpperCase())}</div>`}
        </div>
        <div class="live-search-copy">
          <div class="live-search-title">${escapeHtml(item.title)}</div>
          <div class="live-search-meta">
            ${item.kind ? `<span>${escapeHtml(item.kind)}</span>` : ''}
            ${item.year ? `<span>${escapeHtml(item.year)}</span>` : ''}
            ${item.rating ? `<span>★ ${escapeHtml(Number(item.rating).toFixed(1))}</span>` : ''}
          </div>
        </div>
      </a>
    `).join('');
    box.hidden = false;
    box.dataset.index = '-1';
    activeBox = box;
  }

  function updateActive(box, nextIndex) {
    const items = Array.from(box.querySelectorAll('.live-search-item'));
    if (!items.length) return;
    const max = items.length - 1;
    const index = Math.max(-1, Math.min(nextIndex, max));
    box.dataset.index = String(index);
    items.forEach((item, i) => item.classList.toggle('is-active', i === index));
  }

  forms.forEach(form => {
    const input = form.querySelector('input[name="q"]');
    if (!input) return;

    const box = document.createElement('div');
    box.className = 'live-search-box';
    box.hidden = true;
    box.dataset.index = '-1';
    form.appendChild(box);

    let timer = null;
    let reqId = 0;

    async function fetchResults(query) {
      reqId += 1;
      const currentReq = reqId;
      try {
        const res = await fetch(`/api/live-search?q=${encodeURIComponent(query)}`, {
          headers: { Accept: 'application/json' },
        });
        const data = await res.json();
        if (currentReq !== reqId) return;
        renderBox(box, Array.isArray(data.results) ? data.results : [], query);
      } catch (_) {
        if (currentReq !== reqId) return;
        closeBox(box);
      }
    }

    input.addEventListener('input', () => {
      const query = input.value.trim();
      window.clearTimeout(timer);
      if (query.length < 2) {
        closeBox(box);
        return;
      }
      timer = window.setTimeout(() => fetchResults(query), 180);
    });

    input.addEventListener('keydown', event => {
      if (box.hidden) return;
      const items = Array.from(box.querySelectorAll('.live-search-item'));
      if (!items.length) return;

      const current = Number(box.dataset.index || '-1');
      if (event.key === 'ArrowDown') {
        event.preventDefault();
        updateActive(box, current + 1);
      } else if (event.key === 'ArrowUp') {
        event.preventDefault();
        updateActive(box, current - 1);
      } else if (event.key === 'Escape') {
        closeBox(box);
      } else if (event.key === 'Enter' && current >= 0 && items[current]) {
        event.preventDefault();
        window.location.href = items[current].href;
      }
    });

    input.addEventListener('blur', () => {
      window.setTimeout(() => closeBox(box), 160);
    });

    input.addEventListener('focus', () => {
      if (input.value.trim().length >= 2 && box.innerHTML.trim()) {
        box.hidden = false;
        activeBox = box;
      }
    });
  });

  document.addEventListener('click', event => {
    if (!activeBox) return;
    if (activeBox.contains(event.target)) return;
    const hostForm = activeBox.parentElement;
    if (hostForm && hostForm.contains(event.target)) return;
    closeBox(activeBox);
  });

  document.addEventListener('contextmenu', event => {
    event.preventDefault();
  });

  document.addEventListener('keydown', event => {
    const key = String(event.key || '').toLowerCase();
    const blockedShortcut =
      event.key === 'F12' ||
      (event.ctrlKey && event.shiftKey && ['i', 'j', 'c'].includes(key)) ||
      (event.ctrlKey && key === 'u');

    if (blockedShortcut) {
      event.preventDefault();
      event.stopPropagation();
    }
  }, true);
})();
</script>
</body>
</html>
