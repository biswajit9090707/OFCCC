<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Admin{% endblock %} · HubStream Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#0b0b0f;--panel:#14141b;--panel-2:#1c1c25;--line:#25252f;--fg:#f3f4f6;--muted:#9aa0a6;--accent:#ff5b3a;--accent-2:#ff8a3a;--good:#41d18a;--blue:#3a8cff;--purple:#b45aff;--sb:220px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--fg);font-family:'Inter',sans-serif;min-height:100vh;display:flex;}
a{color:inherit;text-decoration:none;}
img{display:block;max-width:100%;}

/* sidebar */
.sidebar{width:var(--sb);min-height:100vh;background:rgba(20,20,27,.95);
  border-right:1px solid var(--line);display:flex;flex-direction:column;
  position:fixed;top:0;left:0;bottom:0;z-index:50;padding:20px 0;}
.sb-logo{display:flex;align-items:center;gap:10px;padding:0 20px 20px;
  border-bottom:1px solid var(--line);}
.sb-mark{width:34px;height:34px;border-radius:9px;flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  display:flex;align-items:center;justify-content:center;font-size:14px;}
.sb-title{font-size:13px;font-weight:700;}
.sb-sub{font-size:10px;color:var(--muted);margin-top:1px;}
.sb-nav{flex:1;padding:16px 12px;display:flex;flex-direction:column;gap:4px;}
.sb-link{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;
  font-size:13px;font-weight:500;color:var(--muted);transition:all .15s;}
.sb-link:hover{background:rgba(255,255,255,.05);color:var(--fg);}
.sb-link.active{background:rgba(255,91,58,.12);color:var(--accent);}
.sb-link .icon{font-size:16px;width:20px;text-align:center;}
.sb-sep{height:1px;background:var(--line);margin:8px 12px;}
.sb-footer{padding:16px 20px;border-top:1px solid var(--line);}
.sb-logout{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);
  padding:8px 10px;border-radius:8px;transition:all .15s;}
.sb-logout:hover{background:rgba(255,91,58,.1);color:var(--accent);}

/* main */
.main{margin-left:var(--sb);flex:1;padding:28px 32px 60px;min-height:100vh;}
.page-header{margin-bottom:28px;}
.page-header h1{font-size:24px;font-weight:800;letter-spacing:-.3px;}
.page-header p{color:var(--muted);font-size:13px;margin-top:4px;}
.view-site{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;
  border-radius:8px;font-size:12px;font-weight:600;
  background:rgba(255,255,255,.06);border:1px solid var(--line);
  color:var(--muted);margin-top:10px;transition:all .15s;}
.view-site:hover{border-color:#3a3a48;color:var(--fg);}

/* stat cards */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:28px;}
.stat-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:18px 20px;position:relative;overflow:hidden;}
.stat-card::before{content:'';position:absolute;top:0;right:0;width:80px;height:80px;
  border-radius:50%;opacity:.08;background:var(--c,var(--accent));
  transform:translate(20px,-20px);}
.stat-card .sc-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:8px;}
.stat-card .sc-val{font-size:30px;font-weight:800;letter-spacing:-1px;color:var(--c,var(--fg));}
.stat-card .sc-sub{font-size:11px;color:var(--muted);margin-top:4px;}

/* section */
.section{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-bottom:24px;}
.section-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:16px;}

/* table */
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;padding:10px 12px;font-size:11px;font-weight:600;text-transform:uppercase;
  letter-spacing:.4px;color:var(--muted);border-bottom:1px solid var(--line);}
td{padding:12px 12px;border-bottom:1px solid rgba(37,37,47,.6);vertical-align:middle;}
tr:last-child td{border-bottom:0;}
tr:hover td{background:rgba(255,255,255,.02);}
.thumb{width:36px;height:52px;border-radius:6px;object-fit:cover;background:var(--panel-2);}
.thumb-placeholder{width:36px;height:52px;border-radius:6px;background:var(--panel-2);
  display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--line);}
.badge-type{font-size:10px;font-weight:700;padding:3px 7px;border-radius:5px;
  text-transform:uppercase;letter-spacing:.4px;}
.badge-type.movie{background:rgba(255,91,58,.2);color:var(--accent);}
.badge-type.tv{background:rgba(58,140,255,.2);color:var(--blue);}
.badge-featured{font-size:10px;font-weight:700;padding:3px 7px;border-radius:5px;
  background:rgba(65,209,138,.15);color:var(--good);}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;
  font-size:13px;font-weight:600;border:0;cursor:pointer;transition:filter .15s,transform .12s;}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px);}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;}
.btn-ghost{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--fg);}
.btn-ghost:hover{border-color:#3a3a48;}
.btn-danger{background:rgba(255,60,60,.15);border:1px solid rgba(255,60,60,.25);color:#ff6060;}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn-star{background:rgba(255,193,7,.1);border:1px solid rgba(255,193,7,.2);color:#ffc107;}

/* form */
.form-group{margin-bottom:16px;}
.form-group label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:6px;}
.form-group input,.form-group textarea,.form-group select{
  width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);
  border-radius:10px;padding:11px 14px;color:var(--fg);font-size:14px;outline:none;
  font-family:inherit;transition:border-color .2s;}
.form-group input:focus,.form-group textarea:focus{border-color:var(--accent);}
.search-bar{display:flex;gap:8px;margin-bottom:20px;}
.search-bar input{flex:1;}

/* movie search results */
.results-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:16px;}
.r-card{background:var(--panel-2);border:2px solid var(--line);border-radius:12px;
  overflow:hidden;cursor:pointer;transition:border-color .15s,transform .15s;}
.r-card:hover{border-color:var(--accent);transform:translateY(-2px);}
.r-card.selected{border-color:var(--accent);box-shadow:0 0 0 2px rgba(255,91,58,.25);}
.r-card-poster{aspect-ratio:2/3;background:var(--panel);position:relative;}
.r-card-poster img{width:100%;height:100%;object-fit:cover;}
.r-card-body{padding:8px 10px 10px;}
.r-card-title{font-size:12px;font-weight:600;line-height:1.3;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.r-card-year{font-size:11px;color:var(--muted);margin-top:3px;}

/* detail panel */
.detail-panel{background:var(--panel-2);border:1px solid var(--line);border-radius:14px;
  padding:20px;margin-top:20px;display:none;}
.detail-panel.show{display:flex;gap:20px;}
.detail-panel img{width:100px;border-radius:10px;flex-shrink:0;}
.detail-panel .dp-body h2{font-size:18px;font-weight:700;margin-bottom:6px;}
.detail-panel .dp-meta{font-size:12px;color:var(--muted);margin-bottom:10px;}
.detail-panel .dp-overview{font-size:13px;line-height:1.6;color:#d8dadf;margin-bottom:14px;
  max-height:80px;overflow:hidden;}

/* toast */
.toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:10px;
  font-size:13px;font-weight:600;z-index:999;transform:translateY(80px);
  transition:transform .3s ease;pointer-events:none;}
.toast.show{transform:translateY(0);}
.toast.ok{background:rgba(65,209,138,.15);border:1px solid rgba(65,209,138,.3);color:var(--good);}
.toast.err{background:rgba(255,60,60,.15);border:1px solid rgba(255,60,60,.3);color:#ff6060;}

/* empty */
.empty-state{text-align:center;padding:60px 20px;color:var(--muted);}
.empty-state .es-icon{font-size:48px;margin-bottom:12px;}
.empty-state p{font-size:14px;}

@media(max-width:768px){
  .sidebar{transform:translateX(-100%);}
  .main{margin-left:0;padding:20px 16px 48px;}
  .stat-grid{grid-template-columns:repeat(2,1fr);}
}
</style>
{% block extra_style %}{% endblock %}
</head>
<body>
<nav class="sidebar">
  <div class="sb-logo">
    <div class="sb-mark">▶</div>
    <div>
      <div class="sb-title">HubStream Pro</div>
      <div class="sb-sub">Admin Panel</div>
    </div>
  </div>
  <div class="sb-nav">
    <a href="/admin" class="sb-link {% if request.path == '/admin' or request.path == '/admin/' %}active{% endif %}">
      <span class="icon">📊</span> Dashboard
    </a>
    <a href="/admin/movies" class="sb-link {% if '/admin/movies' in request.path and 'add' not in request.path %}active{% endif %}">
      <span class="icon">🎬</span> Movies
    </a>
    <a href="/admin/movies/add" class="sb-link {% if '/admin/movies/add' in request.path %}active{% endif %}">
      <span class="icon">➕</span> Add Movie
    </a>
    <a href="/admin/settings" class="sb-link {% if '/admin/settings' in request.path %}active{% endif %}">
      <span class="icon">⚙️</span> Settings
    </a>
    <div class="sb-sep"></div>
    <a href="/" target="_blank" class="sb-link">
      <span class="icon">🌐</span> View Site
    </a>
  </div>
  <div class="sb-footer">
    <a href="/admin/logout" class="sb-logout">
      <span>🚪</span> Sign Out
    </a>
  </div>
</nav>

<main class="main">
  {% block content %}{% endblock %}
</main>

<div class="toast" id="toast"></div>
<script>
function showToast(msg, type='ok'){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='toast '+type+' show';
  setTimeout(()=>t.classList.remove('show'),3200);
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
